<!doctype html>
<!--
	data-ds — выбранная дизайн-система (slug из таблицы `design_systems`).
	Значения токенов приходят из $lib/design-systems/<slug>.css; смена атрибута
	перекрашивает весь сайт без пересборки CSS.

	Значение `base` в теге ниже — это ДЕФОЛТ, а не заглушка. Выбор владельца сайта
	хранится в JSON шапки лицензии (ключ `designSystem`), читается в loadRenderPage()
	и уходит в locals.designSystem; hooks.server.ts на этапе рендера (transformPageChunk)
	подменяет им дефолтный слаг в открывающем теге. Сайт, ничего не выбравший, и
	служебные маршруты (настройки, админка, /_ds) остаются на Базовой — её и отдаёт дефолт.

	ВНИМАНИЕ: замена в hook строковая и якорится на открывающий тег. Не вписывай в ЭТОТ
	комментарий сам атрибут значением — комментарий уходит в браузер и стоит ВЫШЕ тега,
	так что литерал-двойник перехватил бы подстановку. Про слаги пиши словами (base,
	graphite) в обратных кавычках, без формы «атрибут-равно-значение».

	Базовая объявлена и на голом `:root`, поэтому потеря атрибута оставляет сайт
	с рабочей палитрой, а не без токенов. Проверить систему руками можно из DevTools,
	поменяв слаг в атрибуте на `graphite`.
-->
<html lang="ru" data-ds="base">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!--
			Полоса акций, закрытая посетителем, не должна мигать.

			Разметку полосы отдаёт сервер, а о сессии посетителя он не знает и знать
			не может — значит, закрытая полоса приезжает в HTML и без этой строки
			успевала бы отрисоваться и исчезнуть на гидратации: прыжок содержимого
			в самом верху страницы, и на каждом переходе заново. Признак ставится
			до первой отрисовки, дальше по нему полосу прячет CSS и обнуляет вычет
			высоты — см. templates/Promo-1/layout/PromoStrip/promo-strip.css.

			Ключ хранилища и имя атрибута продублированы литералами в
			templates/Promo-1/layout/PromoStrip/session.ts — менять надо в обоих.
		-->
		<script>
			try {
				if (sessionStorage.getItem('leget:promo-closed') === '1') {
					document.documentElement.setAttribute('data-promo-closed', '');
				}
			} catch (e) {
				/* приватный режим — полоса просто будет показана */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
